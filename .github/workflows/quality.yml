name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate locale data
        run: npm run generate-locales

      - name: Check generated locale data
        run: git diff --exit-code -- src/locales/generated.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --watch=false

      - name: Check formatting
        run: npx prettier --check .

      - name: Export platform bundles
        env:
          EXPO_PUBLIC_IAP_ENV: test
        run: |
          npx expo export --platform web
          npx expo export --platform ios
          npx expo export --platform android
