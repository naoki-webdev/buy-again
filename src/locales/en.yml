terms:
  title: "Terms of use"
  intro: "buy-again is a personal memo app for recording impressions of products you bought."
  use_title: "Service scope"
  use_body: "The app is not an inventory, ordering, accounting, or quality-control system. Do not use records as a basis for food safety, allergy, health, or medical decisions."
  storage_title: "Data storage"
  storage_body: "Records and photos are stored on the device. Persistence, integrity, availability, and recovery are not guaranteed. Data may be lost through device failure, loss, OS processing, or app deletion. Do not use this app as your only storage."
  external_title: "External services"
  external_body: "Open Food Facts is used for barcode lookup. The accuracy, completeness, and freshness of its information are not guaranteed. Network failures, outages, and changes may make it unavailable."
  purchase_title: "One-time unlock"
  purchase_body: "The free version supports up to 20 new product registrations. The one-time unlock is not a subscription. Price, tax, refunds, purchase history, and restoration follow the store terms and applicable law."
  disclaimer_title: "Disclaimers and liability"
  disclaimer_body: "To the extent permitted by law, the developer is not liable for damage arising from use of the app or external services. This excludes liability that cannot be limited by law, or liability for wilful misconduct or gross negligence."
  changes_title: "Changes to these terms"
  changes_body: "These terms may be changed when necessary. Updated terms apply when announced in the app or on its distribution page."
  law_title: "Governing law and jurisdiction"
  law_body: "These terms are governed by the laws of Japan. Disputes are handled by the court with jurisdiction under applicable law."
  contact_title: "Contact"
  contact_body: "Developer: naoki-webdev\nContact: https://github.com/naoki-webdev/buy-again/issues"

accessibility:
  title: "Accessibility"
  intro: "We continue improving screens for VoiceOver and TalkBack, larger text sizes, and layouts that remain understandable across screen sizes."
  interaction_title: "Interaction and display"
  interaction_body: "Meaningful controls have spoken names, and ratings are identified by labels as well as color. We continue checking behavior with larger text and different screen sizes."
  alternative_title: "Alternatives"
  alternative_body: "Barcodes can be entered manually without using the camera. You can use manual entry and save records without photos when camera or photo access is not granted."
  standard_title: "Reference standard"
  standard_body: "WCAG 2.2 AA is used as a reference. This is not a claim that the app fully conforms to that standard."
  contact_title: "Contact"
  contact_body: "Please send accessibility issues or suggestions to https://github.com/naoki-webdev/buy-again/issues."

privacy:
  title: "Privacy and data"
  intro: "buy-again is a personal app for keeping shopping memories on your device."
  local_title: "Information stored on this device"
  local_body: "The app stores product names, brands, barcodes, ratings, notes, creation and update dates, and product photos on the device. Product records and product photos saved in the app, including photos selected by the user and images retrieved from Open Food Facts, are not sent to the developer's servers. Product records remain on the device until the user deletes them in the app or uninstalls the app. The app does not require an account and does not use advertising, analytics, or cloud synchronization to servers operated by the developer. Depending on your device's OS backup settings, Google or Apple backup services may include this data."
  network_title: "Open Food Facts requests"
  network_body: "When checking an unregistered food barcode, the app sends the barcode number and display language to Open Food Facts. Product records and photos are not included in search requests. API requests also include a User-Agent containing the app name, version, and public repository URL. You can review and edit returned names, brands, and images before saving. Open Food Facts' Privacy Policy and Terms of Use apply to the retention and deletion of information on that service. The buy-again developer does not manage information stored by Open Food Facts."
  permissions_title: "Device permissions"
  permissions_body: "The camera is used when scanning barcodes. Photo access is used when selecting a product photo. You can still enter barcodes manually and register products without photos if you do not grant these permissions. Camera and photo access permissions can be changed or revoked at any time in the device settings."
  security_title: "Secure handling"
  security_body: "Product records and photos are stored in the app-specific storage area on the device. The app uses HTTPS for communication with Open Food Facts."
  deletion_title: "Deletion"
  deletion_body: "You can delete a product record from the product detail screen. Deleting a product record also deletes the product photo saved on the device by buy-again. For deletion requests concerning a barcode sent to Open Food Facts or questions about its data processing, use the contact methods described in the Open Food Facts Privacy Policy."
  third_party_title: "Third-party service and licenses"
  third_party_body: "Product information is provided using data from Open Food Facts. The database is provided under the Open Database License (ODbL), individual database contents under the Database Contents License, and product images under the Creative Commons Attribution-ShareAlike (CC BY-SA) terms. See the Open Food Facts official site for license details and reuse conditions."
  purchase_title: "App Store and Google Play purchases"
  purchase_body: "If you use the one-time unlock, Apple or Google processes the payment information. The buy-again developer does not receive card details. The app uses purchase information provided by the stores to check the unlock state. The stores' privacy policies and terms apply to purchases, refunds, and billing history."
  contact_title: "Developer information and contact"
  contact_body: "Developer: naoki-webdev\nPrivacy inquiries: https://github.com/naoki-webdev/buy-again/issues"
  off_link: "Open the Open Food Facts site"

