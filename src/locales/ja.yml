terms:
  title: "利用規約"
  intro: "buy-againは、購入した商品の印象を記録する個人用メモアプリです。"
  use_title: "サービスの性質"
  use_body: "在庫、発注、会計、品質管理を行う業務システムではありません。記録を食品の安全性、アレルギー、健康状態、医療上の判断の根拠に使用しないでください。"
  storage_title: "データの保存"
  storage_body: "記録と写真は端末に保存されます。永続性、完全性、利用可能性、復旧可能性を保証しません。故障、紛失、OSの処理、アプリ削除などでデータが失われることがあります。本アプリを唯一の保存先にしないでください。"
  external_title: "外部サービス"
  external_body: "バーコード検索のOpen Food Factsについて、情報の正確性、完全性、最新性を保証しません。通信障害、停止、仕様変更で利用できない場合があります。"
  purchase_title: "買い切りアンロック"
  purchase_body: "無料版は商品を20件まで新規登録できます。買い切りアンロックはサブスクリプションではありません。価格、税、返金、購入履歴、復元は各ストアの規約と適用法令に従います。"
  disclaimer_title: "免責と責任"
  disclaimer_body: "適用法令で許される範囲で、本アプリまたは外部サービスの利用による損害について責任を負いません。ただし、法令により制限できない責任、故意または重過失による責任などを除きます。"
  changes_title: "規約の変更"
  changes_body: "必要に応じて規約を変更することがあります。変更後の規約は、本アプリまたは配布ページで告知した時点から適用します。"
  law_title: "準拠法と管轄"
  law_body: "本規約は日本法に準拠します。紛争は、適用法令が定める管轄裁判所によって解決します。"
  contact_title: "お問い合わせ"
  contact_body: "開発者：naoki-webdev\nお問い合わせ：https://github.com/naoki-webdev/buy-again/issues"

accessibility:
  title: "アクセシビリティ"
  intro: "VoiceOverとTalkBackで操作しやすい画面、文字サイズを大きくした場合にも確認しやすいレイアウトを目指して改善しています。"
  interaction_title: "操作と表示"
  interaction_body: "重要な操作には読み上げ用の名前を設定し、評価は色だけでなくラベルでも示します。大きな文字設定や画面サイズによる表示の変化を継続的に確認します。"
  alternative_title: "代替手段"
  alternative_body: "バーコードはカメラを使わず番号を手入力できます。カメラや写真へのアクセスを許可しなくても、手入力と写真なしの記録を利用できます。"
  standard_title: "参照基準"
  standard_body: "WCAG 2.2 AAを参照していますが、本アプリが同基準に完全準拠していることを表明するものではありません。"
  contact_title: "お問い合わせ"
  contact_body: "利用上の問題や改善提案はhttps://github.com/naoki-webdev/buy-again/issuesまでお知らせください。"

privacy:
  title: "プライバシーとデータ"
  intro: "buy-againは、買った商品の記録を端末内で管理する個人用アプリです。"
  local_title: "端末内に保存する情報"
  local_body: "商品名、ブランド、バーコード、評価、メモ、登録日時、更新日時、商品写真を端末内に保存します。商品記録およびアプリ内に保存した商品写真（ユーザーが選択した写真やOpen Food Factsから取得した画像）を、開発者のサーバーへ送信することはありません。商品記録は、ユーザーがアプリ内で削除するか、アプリを削除するまで端末内に保持されます。アカウント登録、広告、アクセス解析、開発者が運営するサーバーへのクラウド同期は行いません。端末のOSバックアップ設定によっては、GoogleまたはAppleが提供するバックアップ機能の対象となる場合があります。"
  network_title: "Open Food Factsへの問い合わせ"
  network_body: "未登録の食品バーコードを確認するとき、アプリはバーコード番号と表示言語をOpen Food Factsへ送信します。商品記録や写真は検索リクエストに含めません。APIリクエストには、アプリ名、バージョン、公開リポジトリURLを含むUser-Agentも設定します。取得した商品名、ブランド、画像は保存前に確認と編集ができます。Open Food Facts側での情報の保持と削除には、同サービスのプライバシーポリシーと利用条件が適用されます。buy-againの開発者は、Open Food Facts側に保存された情報を管理しません。"
  permissions_title: "端末の権限"
  permissions_body: "カメラはバーコード読み取り時に使用します。写真へのアクセスは商品写真の選択時に使用します。どちらも許可しなくても、手入力と写真なしの記録は利用できます。カメラおよび写真へのアクセス許可は、端末の設定からいつでも変更または取り消すことができます。"
  security_title: "安全な取り扱い"
  security_body: "商品記録と写真は、アプリ専用の端末内領域に保存します。Open Food Factsとの通信にはHTTPSを使用します。"
  deletion_title: "削除"
  deletion_body: "商品詳細画面から商品記録を削除できます。商品記録を削除すると、buy-againが端末内に保存した商品写真も削除します。Open Food Factsへ送信したバーコードの削除や、同サービスでのデータ処理に関する問い合わせは、同サービスのプライバシーポリシーに記載された方法で行ってください。"
  third_party_title: "第三者サービスとライセンス"
  third_party_body: "商品情報はOpen Food Factsのデータを利用しています。データベースはOpen Database License（ODbL）、個別のデータ内容はDatabase Contents License、商品画像はCreative Commons Attribution-ShareAlike（CC BY-SA）の条件で提供されています。ライセンスの詳細と再利用条件は、Open Food Factsの公式サイトで確認してください。"
  purchase_title: "App StoreとGoogle Playの購入"
  purchase_body: "買い切りアンロックを利用する場合、決済情報はAppleまたはGoogleが処理します。buy-againの開発者はカード情報を取得しません。購入状態の確認には、各ストアが提供する購入情報をアプリが利用します。購入、返金、請求履歴には各ストアのプライバシーポリシーと利用規約が適用されます。"
  contact_title: "開発者情報とお問い合わせ"
  contact_body: "開発者：naoki-webdev\nプライバシーに関するお問い合わせ：https://github.com/naoki-webdev/buy-again/issues"
  off_link: "Open Food Factsのサイトを開く"

